name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-docs-prod
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep SAST
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --severity ERROR \
            --error

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy script on remote
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; cd \"$DEPLOY_PATH\" && ./deploy.sh"

      - name: Smoke test
        env:
          HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sI -m 10 -L -o /dev/null -w '%{http_code}' "$HEALTHCHECK_URL") || code=000
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Smoke test failed"
          exit 1
