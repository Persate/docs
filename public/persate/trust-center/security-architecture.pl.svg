<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-labelledby="title desc" font-family='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title id="title">Persate — przepływ danych i punkty szyfrowania</title>
<desc id="desc">Widok uproszczony dla zespołów bezpieczeństwa. Niebieskie strzałki: szyfrowanie TLS w tranzycie. Pomarańczowy obszar przerywany: sieć prywatna, niedostępna z internetu.</desc>
