<text x="30" y="56" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">Widok uproszczony dla zespołów bezpieczeństwa. Niebieskie strzałki: szyfrowanie TLS w tranzycie. Pomarańczowy obszar przerywany: sieć prywatna, niedostępna z internetu.</text>
