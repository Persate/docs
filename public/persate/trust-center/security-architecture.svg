<text x="282" y="112" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Persate platform — EU hosting</text>
<rect x="290" y="126" width="520" height="108" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.5"/>
<text x="300" y="145" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="start">Web application tier</text>
<rect x="300" y="156" width="245" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/><text x="422.5" y="176.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Web application server</text><text x="422.5" y="191.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">sign-in, pages, session checks</text>
<rect x="565" y="156" width="235" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/><text x="682.5" y="176.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Public documentation</text><text x="682.5" y="191.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">read-only</text>
<text x="550" y="224" font-size="10" font-weight="500" fill="#1e3a8a" text-anchor="middle">TLS termination · HSTS · Secure, SameSite session cookies · no browser-readable tokens</text>
