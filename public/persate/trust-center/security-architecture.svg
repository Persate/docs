<rect x="300" y="420" width="240" height="46" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/><text x="420" y="439.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Background workers</text><text x="420" y="454.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">processing, alerts, indexing</text>
