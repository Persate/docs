<rect x="45" y="210" width="170" height="62" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/><text x="130" y="237.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Mobile app</text><text x="130" y="252.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">same session model</text>
<rect x="45" y="290" width="170" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="130" y="308.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Persate operators</text><text x="130" y="323.5" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">VPN + TLS, restricted</text>
