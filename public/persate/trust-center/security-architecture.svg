<rect x="679" y="514" width="111" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/><text x="734.5" y="535.3" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2937">Public legal</text><text x="734.5" y="550.3" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">corpus database</text>
<text x="550" y="604" font-size="10" font-weight="500" fill="#ea580c" text-anchor="middle">Reachable only from application services and workers</text>
