<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-labelledby="title desc" font-family='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title id="title">Persate — data flow and encryption points</title>
<desc id="desc">Simplified view for security reviewers. Blue arrows: TLS-encrypted in transit. Orange dashed area: private network, not reachable from the internet.</desc>
<defs>
  <marker id="arrow-tls" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  <marker id="arrow-priv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
  <marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1179" height="719" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
