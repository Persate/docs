<rect x="885" y="340" width="250" height="74" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/><text x="1010" y="365.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Object storage — EU (Poland)</text><text x="1010" y="380.5" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">Uploaded documents and previews</text><text x="1010" y="395.5" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">Vector segments, database backups</text>
<rect x="885" y="440" width="250" height="74" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/><text x="1010" y="465.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">AI and email providers</text><text x="1010" y="480.5" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">Called over TLS per request</text><text x="1010" y="495.5" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">Listed as sub-processors in the DPA</text>
