<text x="882" y="112" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Managed services — EU</text>
<rect x="885" y="130" width="250" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/><text x="1010" y="157.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Managed PostgreSQL</text><text x="1010" y="172.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">Tenant isolation (row-level security)</text><text x="1010" y="187.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">Encrypted at rest (provider-managed AES-256)</text><text x="1010" y="202.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">Daily backups</text>
